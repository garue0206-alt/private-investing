name: Daily 6 Market Screeners - 0100 UTC

on:
  workflow_dispatch:
    inputs:
      jobs:
        description: "all 또는 leader_all,alt_bull,news,leader_collection,crypto_collection,lowfloat_fire"
        required: true
        default: "all"
        type: string
      send_documents:
        description: "CSV/결과 파일도 Telegram으로 전송"
        required: true
        default: true
        type: boolean

  schedule:
    # 매일 01:00 UTC = 한국시간 10:00 KST
    - cron: "0 1 * * *"

permissions:
  contents: read

concurrency:
  group: daily-6-market-screeners-${{ github.ref }}
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 180

    env:
      PYTHONUTF8: "1"
      PYTHONUNBUFFERED: "1"
      TZ: "Asia/Seoul"
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      DART_API_KEY: ${{ secrets.DART_API_KEY }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m ipykernel install --user --name python3 --display-name "Python 3"

      - name: Restore screener state
        uses: actions/cache/restore@v5
        with:
          path: state
          key: screener-state-${{ runner.os }}-${{ github.run_id }}
          restore-keys: |
            screener-state-${{ runner.os }}-

      - name: Validate repository and notebooks
        run: |
          python scripts/validate_repo.py
          python -m unittest discover -s tests -v

      - name: Run all 6 screeners and send Telegram
        id: screeners
        continue-on-error: true
        shell: bash
        run: |
          JOBS="${{ github.event.inputs.jobs }}"
          SEND_DOCUMENTS="${{ github.event.inputs.send_documents }}"

          # 예약 실행(schedule)에서는 입력값이 없으므로 전체 6개 자동 실행
          if [ -z "$JOBS" ]; then
            JOBS="all"
          fi

          EXTRA_ARGS=""
          if [ "$SEND_DOCUMENTS" = "false" ]; then
            EXTRA_ARGS="--no-documents"
          fi

          python -m src.main --jobs "$JOBS" $EXTRA_ARGS

      - name: Save screener state
        if: always()
        uses: actions/cache/save@v5
        with:
          path: state
          key: screener-state-${{ runner.os }}-${{ github.run_id }}

      - name: Upload all results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: market-screeners-${{ github.run_id }}
          path: outputs/
          if-no-files-found: warn
          retention-days: 30

      - name: Mark workflow failed when a screener failed
        if: always() && steps.screeners.outcome != 'success'
        run: |
          echo "한 개 이상의 스크리너 또는 Telegram 전송이 실패했습니다."
          exit 1
