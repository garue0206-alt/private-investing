name: Weekday 6 Market Screeners - 09:20 KST

on:
  schedule:
    - cron: "20 9 * * 1-5"
      timezone: "Asia/Seoul"

permissions:
  contents: read

concurrency:
  group: weekday-6-market-screeners
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 180

    env:
      PYTHONUTF8: "1"
      PYTHONUNBUFFERED: "1"
      TZ: "Asia/Seoul"
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      DART_API_KEY: ${{ secrets.DART_API_KEY }}

    steps:
      - name: Confirm scheduled start time
        run: |
          echo "Event: $GITHUB_EVENT_NAME"
          echo "UTC now: $(date -u '+%Y-%m-%d %H:%M:%S UTC')"
          echo "KST now: $(TZ=Asia/Seoul date '+%Y-%m-%d %H:%M:%S KST')"

      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m ipykernel install --user --name python3 --display-name "Python 3"

      - name: Restore screener state
        uses: actions/cache/restore@v5
        with:
          path: state
          key: screener-state-${{ runner.os }}-${{ github.run_id }}
          restore-keys: |
            screener-state-${{ runner.os }}-

      - name: Validate repository and notebooks
        run: |
          python scripts/validate_repo.py
          python -m unittest discover -s tests -v

      - name: Run all 6 screeners and send Telegram
        id: screeners
        continue-on-error: true
        run: |
          python -m src.main --jobs all

      - name: Save screener state
        if: always()
        uses: actions/cache/save@v5
        with:
          path: state
          key: screener-state-${{ runner.os }}-${{ github.run_id }}

      - name: Upload all results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: market-screeners-${{ github.run_id }}
          path: outputs/
          if-no-files-found: warn
          retention-days: 30

      - name: Mark workflow failed when a screener failed
        if: always() && steps.screeners.outcome != 'success'
        run: |
          echo "한 개 이상의 스크리너 또는 Telegram 전송이 실패했습니다."
          exit 1
