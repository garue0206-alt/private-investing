name: Run 5 Market Screeners

on:
  workflow_dispatch:
    inputs:
      jobs:
        description: "all 또는 leader_all,alt_bull,news,leader_collection,crypto_collection"
        required: true
        default: "all"
        type: string
      send_documents:
        description: "CSV/로그 파일도 Telegram으로 전송"
        required: true
        default: true
        type: boolean

  schedule:
    # 한국시간 월~금 오후 4시 35분
    # KST = UTC+9이므로 UTC 07:35
    - cron: "35 7 * * 1-5"

permissions:
  contents: read

concurrency:
  group: market-screeners-${{ github.ref }}
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 180

    env:
      PYTHONUTF8: "1"
      PYTHONUNBUFFERED: "1"
      TZ: "Asia/Seoul"

      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}

    steps:

      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m ipykernel install --user --name python3 --display-name "Python 3"

      - name: Validate repository
        run: |
          python scripts/validate_repo.py

      - name: Run screeners and send Telegram
        id: screeners
        continue-on-error: true
        shell: bash
        run: |
          JOBS="${{ github.event.inputs.jobs }}"
          SEND_DOCUMENTS="${{ github.event.inputs.send_documents }}"

          if [ -z "$JOBS" ]; then
            JOBS="all"
          fi

          EXTRA_ARGS=""

          if [ "$SEND_DOCUMENTS" = "false" ]; then
            EXTRA_ARGS="--no-documents"
          fi

          python -m src.main --jobs "$JOBS" $EXTRA_ARGS

      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: market-screeners-${{ github.run_id }}
          path: outputs/
          if-no-files-found: warn
          retention-days: 30

      - name: Check result
        if: always() && steps.screeners.outcome != 'success'
        run: |
          echo "하나 이상의 스크리너 또는 Telegram 전송이 실패했습니다."
          exit 1
